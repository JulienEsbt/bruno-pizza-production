name: Qualité du projet

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Installer les dépendances desktop
        run: npm ci

      - name: Installer les dépendances de l'application
        run: npm run install:all

      - name: Vérifier le projet
        run: npm run release:check

      - name: Vérifier les dépendances
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
          npm --prefix backend audit --audit-level=high
