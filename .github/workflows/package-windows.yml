name: Fabriquer l'installateur Windows

on:
  workflow_dispatch:
    inputs:
      demo_photos:
        description: Inclure les quatre photos de démonstration de la Reine (test uniquement)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-windows:
    name: Appli Montage — Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Installer les dépendances desktop
        run: npm ci

      - name: Installer les dépendances de l'application
        run: npm run install:all

      - name: Vérifier et fabriquer l'installateur
        env:
          BRUNO_DEMO_PHOTOS: ${{ inputs.demo_photos && '1' || '0' }}
        run: npm run make:windows

      - name: Contrôler le fichier final
        id: installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "Appli-Montage-Setup-$version.exe"
          $installer = "out/make/squirrel.windows/x64/$name"
          "path=$installer" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Installateur introuvable : $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          "### Installateur Windows" >> $env:GITHUB_STEP_SUMMARY
          "``$name``" >> $env:GITHUB_STEP_SUMMARY
          "Photos de démonstration : ${{ inputs.demo_photos }}" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256 : ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publier l'installateur unique
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
